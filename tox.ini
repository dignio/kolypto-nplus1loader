[tox]
envlist=
    py{312,313,314}-sa-latest,
    py{312,313,314}-sa1.4.54
#Unsupported: pypy,pypy3
skip_missing_interpreters=True

[testenv]
deps=
    -rrequirements-dev.txt
    sa1.4.54: sqlalchemy==1.4.54
commands=
    python -m unittest {posargs:discover -s . -p '*_test.py'}
allowlist_externals=make

[testenv:dev]
deps=-rrequirements-dev.txt
usedevelop=True
