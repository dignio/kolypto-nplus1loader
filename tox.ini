[tox]
envlist=
    py{312,313,314}-sa-latest,
    py{312,313,314}-sa1.4.54,
    py{312,313,314}-sa1.3.{10,24},
    py{312,313}-sa1.3.0
# sqlalchemy<1.3.10 does not support sqlite on Python 3.14
#Unsupported: pypy,pypy3
skip_missing_interpreters=True

[testenv]
deps=
    -rrequirements-dev.txt
    sa1.4.54: sqlalchemy==1.4.54
    sa1.3.0: sqlalchemy==1.3.0
    sa1.3.10: sqlalchemy==1.3.10
    sa1.3.24: sqlalchemy==1.3.24
commands=
    python -m unittest {posargs:discover -s . -p '*_test.py'}
allowlist_externals=make

[testenv:dev]
deps=-rrequirements-dev.txt
usedevelop=True
